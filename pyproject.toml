[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airmouse"
version = "0.1.0"
description = "NIDAR AirMouse Autonomous Drone Simulation and Autonomy Stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy<2",
    "opencv-python",
    "pygame",
    "ultralytics",
    "pyyaml",
]

[tool.setuptools]
package-dir = {"airmouse" = "."}
packages = [
    "airmouse",
    "airmouse.core",
    "airmouse.core.estimation",
    "airmouse.core.mapping",
    "airmouse.core.exploration",
    "airmouse.core.planning",
    "airmouse.core.control",
    "airmouse.core.perception",
    "airmouse.core.mission",
    "airmouse.backends",
    "airmouse.backends.pygame_sim",
    "airmouse.backends.gazebo_ros2",
    "airmouse.backends.hardware",
    "airmouse.tools",
]
py-modules = ["run", "generate_maps"]

